
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { padding: 1rem 0; }
.top { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.top input { flex: 1; min-width: 160px; font-family: var(--font-mono); font-size: 13px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 0.5px solid var(--color-border-secondary); cursor: pointer; font-family: var(--font-sans); color: var(--color-text-secondary); background: transparent; transition: background 0.15s; }
.pill.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); }
.grid { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 14px 16px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.cmd { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-family: var(--font-sans); }
.b-file { background: #E6F1FB; color: #0C447C; }
.b-text { background: #EAF3DE; color: #27500A; }
.b-proc { background: #FAEEDA; color: #633806; }
.b-net { background: #EEEDFE; color: #3C3489; }
.b-sys { background: #FAECE7; color: #712B13; }
.b-arch { background: #E1F5EE; color: #085041; }
.b-disk { background: #FBEAF0; color: #72243E; }
.desc { font-size: 13px; color: var(--color-text-secondary); font-family: var(--font-sans); margin-bottom: 10px; line-height: 1.5; }
.flags { display: flex; flex-direction: column; gap: 5px; }
.flag-row { display: flex; gap: 8px; align-items: flex-start; }
.flag-key { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-info); min-width: 90px; flex-shrink: 0; }
.flag-desc { font-family: var(--font-sans); font-size: 12px; color: var(--color-text-secondary); line-height: 1.4; }
.empty { color: var(--color-text-tertiary); font-family: var(--font-sans); font-size: 14px; text-align: center; padding: 2rem; }
@media (prefers-color-scheme: dark) {
  .b-file { background: #042C53; color: #B5D4F4; }
  .b-text { background: #173404; color: #C0DD97; }
  .b-proc { background: #412402; color: #FAC775; }
  .b-net { background: #26215C; color: #CECBF6; }
  .b-sys { background: #4A1B0C; color: #F5C4B3; }
  .b-arch { background: #04342C; color: #9FE1CB; }
  .b-disk { background: #4B1528; color: #F4C0D1; }
}
</style>

<div class="wrap">
  <h2 class="sr-only">Linux command reference with flags, descriptions, and category filters</h2>
  <div class="top">
    <input type="text" id="search" placeholder="Search commands or flags…" oninput="render()" />
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const cmds = [
  { cmd:"awk", cat:"text", desc:"Pattern scanning and text processing — column extraction, conditional logic, arithmetic on fields.", flags:[["-F ':'","Set field separator (e.g. colon for /etc/passwd)"],["-v var=val","Assign a variable before execution begins"],["'NR==2'","Process only line number 2 (NR = record number)"],["'$2>10'","Condition on field value — print lines where col 2 > 10"],["-f file.awk","Read awk program from a file instead of inline"]]},
  { cmd:"sed", cat:"text", desc:"Stream editor — substitution, deletion, and in-place editing of file text.", flags:[["-i","Edit file in-place (add backup ext: -i.bak)"],["-n","Suppress automatic printing; use p flag explicitly"],["-e 'cmd'","Specify multiple expressions inline"],["s/old/new/g","Global substitution (g = all occurrences on line)"],["d","Delete matching lines (e.g. /^#/d deletes comments)"]]},
  { cmd:"tail", cat:"text", desc:"Output the last N lines of a file; critical for live log monitoring.", flags:[["-n N","Show last N lines (default 10)"],["-f","Follow — stream new lines as they are appended (live logs)"],["-F","Like -f but re-opens file if rotated (safer for log rotation)"],["-c N","Show last N bytes instead of lines"]]},
  { cmd:"head", cat:"text", desc:"Output the first N lines of a file.", flags:[["-n N","Show first N lines"],["-c N","Show first N bytes"],["-q","Quiet — suppress filename headers when reading multiple files"]]},
  { cmd:"cut", cat:"text", desc:"Extract specific fields or byte ranges from each line of a file.", flags:[["-d ':'","Set delimiter character"],["-f 1,3","Select fields 1 and 3"],["-c 1-10","Select characters 1 through 10"],["--complement","Invert selection — keep everything except specified fields"]]},
  { cmd:"wc", cat:"text", desc:"Count lines, words, and bytes in a file or stdin.", flags:[["-l","Count lines only"],["-w","Count words only"],["-c","Count bytes"],["-m","Count characters (handles multi-byte UTF-8)"],["-L","Print length of the longest line"]]},
  { cmd:"chmod", cat:"file", desc:"Change file or directory permissions using symbolic or octal notation.", flags:[["-R","Apply recursively to all files in a directory"],["-v","Verbose — print each file as it is changed"],["u/g/o/a","Target user, group, other, or all"],["+x / -x","Add or remove execute bit"],["755 / 644","Octet shorthand — rwxr-xr-x / rw-r--r--"]]},
  { cmd:"chown", cat:"file", desc:"Change file owner and/or group.", flags:[["-R","Recursive — change ownership of all files in tree"],["user:group","Set both owner and group in one shot"],["--from=old","Change only if current owner matches (safe swap)"],["-v","Verbose output"]]},
  { cmd:"ln", cat:"file", desc:"Create hard or symbolic links between files.", flags:[["-s","Create a symbolic (soft) link instead of hard link"],["-f","Force — remove existing destination before linking"],["-n","Treat destination symlink as a normal file (no follow)"],["-v","Verbose — print each link created"]]},
  { cmd:"xargs", cat:"file", desc:"Build and execute commands from stdin — glues pipes to commands that don't read stdin.", flags:[["-I {}","Replace {} with each input item in the command"],["-n N","Pass at most N arguments per command invocation"],["-P N","Run N processes in parallel"],["-0","Expect NUL-delimited input (pair with find -print0)"],["-t","Print each command before executing"]]},
  { cmd:"rsync", cat:"file", desc:"Fast, incremental file/directory sync — local or over SSH.", flags:[["-a","Archive mode: recursive + preserve perms/timestamps/symlinks"],["-v","Verbose — show transferred files"],["-z","Compress data during transfer"],["--delete","Remove files from destination not present in source"],["--dry-run (-n)","Simulate without making changes"],["-e ssh","Use SSH as the transport"]]},
  { cmd:"tar", cat:"arch", desc:"Archive (and optionally compress) files into a .tar, .tar.gz, or .tar.bz2 bundle.", flags:[["-c","Create archive"],["-x","Extract archive"],["-v","Verbose — list files being processed"],["-f file.tar","Specify archive filename (always last flag)"],["-z","Compress/decompress with gzip (.tar.gz)"],["-j","Compress/decompress with bzip2 (.tar.bz2)"],["-C /path","Extract into specified directory"]]},
  { cmd:"ps", cat:"proc", desc:"Snapshot of currently running processes.", flags:[["aux","All processes, all users, with CPU/mem (BSD style)"],["-ef","Full-format listing, all processes (POSIX style)"],["--forest","Show process tree (parent→child relationships)"],["-p PID","Show info for a specific process ID"],["-u user","Filter by user"]]},
  { cmd:"top / htop", cat:"proc", desc:"Real-time process monitor — CPU, memory, load. htop adds colors and mouse support.", flags:[["-d N","Update interval in seconds"],["-u user","Filter by user (top)"],["-p PID","Monitor specific PID(s)"],["k (interactive)","Kill a process by PID inside top"],["M / P / T","Sort by memory / CPU / time in htop"]]},
  { cmd:"kill / pkill", cat:"proc", desc:"Send signals to processes. kill targets by PID; pkill targets by name pattern.", flags:[["-9 (SIGKILL)","Force-kill immediately — no cleanup"],["-15 (SIGTERM)","Graceful terminate — default if no signal given"],["-HUP (1)","Reload config without restart (many daemons)"],["-l","List all available signal names"]]},
  { cmd:"systemctl", cat:"sys", desc:"Manage systemd services — start, stop, enable, disable, inspect.", flags:[["start/stop/restart","Control service state immediately"],["enable/disable","Set service to auto-start at boot (or not)"],["status","Show service state, last log lines, PID"],["reload","Re-read config without full restart"],["list-units","List all active units"],["--failed","Show only failed units"]]},
  { cmd:"journalctl", cat:"sys", desc:"Query systemd's binary journal — the central log source on modern Linux.", flags:[["-u service","Filter logs for a specific unit/service"],["-f","Follow — tail live log entries"],["-n N","Show last N lines"],["--since 'Xh ago'","Time-bound queries (e.g. '1 hour ago', 'today')"],["-p err","Filter by priority: emerg alert crit err warning info debug"],["-b","Logs from current boot only"]]},
  { cmd:"crontab", cat:"sys", desc:"Schedule recurring commands using cron expressions.", flags:[["-e","Edit the current user's crontab"],["-l","List current user's cron jobs"],["-r","Remove all cron jobs for current user"],["-u user","Operate on another user's crontab (root only)"]]},
  { cmd:"curl", cat:"net", desc:"Transfer data to/from URLs — HTTP, FTP, S3. Essential for API testing and downloads.", flags:[["-X METHOD","HTTP method: GET POST PUT DELETE etc."],["-H 'Key: Val'","Add a request header"],["-d 'body'","Send request body (implies POST)"],["-o file","Write output to file instead of stdout"],["-L","Follow HTTP redirects"],["-s","Silent — suppress progress meter"],["-I","Fetch headers only (HEAD request)"],["--retry N","Retry on transient failures"]]},
  { cmd:"ssh", cat:"net", desc:"Open an encrypted remote shell or tunnel to another machine.", flags:[["-i keyfile","Use a specific private key"],["-p PORT","Connect on non-default port"],["-L local:host:remote","Local port forward (tunnel remote service to localhost)"],["-N","No command — just set up tunnel without opening shell"],["-v / -vvv","Verbose debugging (add more v for more detail)"],["-A","Agent forwarding — use local keys on remote host"]]},
  { cmd:"netstat / ss", cat:"net", desc:"Show network connections, routing tables, and listening ports. ss is the modern replacement.", flags:[["-t","TCP connections only"],["-u","UDP connections only"],["-l","Listening sockets only"],["-n","Show numeric IPs/ports instead of resolving names"],["-p","Show process name/PID using the socket"],["-a","All sockets (listen + established)"]]},
  { cmd:"ping", cat:"net", desc:"Test reachability and round-trip latency to a host via ICMP.", flags:[["-c N","Stop after N packets"],["-i N","Interval in seconds between packets"],["-s N","Set packet size in bytes"],["-t TTL","Set time-to-live"]]},
  {
    cmd: "lsblk",
    cat: "disk",
    desc: "List block devices (disks, partitions, LVM volumes) in a tree view showing mount points, sizes, and types.",
    flags: [
      ["-a", "Show all devices including empty ones"],
      ["-f", "Show filesystem type, UUID, and label for each partition"],
      ["-o cols", "Custom output columns e.g. NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE"],
      ["-d", "Show disks only — skip partitions/children"],
      ["-p", "Print full device paths (e.g. /dev/sda1 instead of sda1)"],
      ["-J", "Output in JSON format (useful for scripting)"],
      ["-m", "Show permissions and owner of device nodes"],
    ]
  },
  {
    cmd: "fdisk",
    cat: "disk",
    desc: "Partition table editor for MBR disks. Use gdisk or parted for GPT. Requires root.",
    flags: [
      ["-l", "List all partition tables on all block devices"],
      ["-l /dev/sda", "List partitions on a specific disk"],
      ["-u sectors", "Display sizes in sectors instead of cylinders"],
      ["interactive", "Run fdisk /dev/sdX to enter interactive partition editor"],
    ]
  },
  {
    cmd: "mount / umount",
    cat: "disk",
    desc: "Attach or detach a filesystem at a mount point. Reads /etc/fstab for persistent mounts.",
    flags: [
      ["-t type", "Specify filesystem type: ext4, xfs, nfs, tmpfs etc."],
      ["-o options", "Mount options: ro, rw, noexec, bind, remount"],
      ["--bind", "Bind-mount a directory to another path (no new fs)"],
      ["-a", "Mount all entries in /etc/fstab"],
      ["-l", "List currently mounted filesystems with labels"],
      ["-f (umount)", "Lazy unmount — detach when no longer busy"],
    ]
  },
];

const cats = [
  { key:"all", label:"All" },
  { key:"text", label:"Text processing" },
  { key:"file", label:"File & perms" },
  { key:"proc", label:"Processes" },
  { key:"sys", label:"System" },
  { key:"net", label:"Networking" },
  { key:"arch", label:"Archives" },
  { key:"disk", label:"Disk & storage" },
];

const badgeClass = { file:"b-file", text:"b-text", proc:"b-proc", net:"b-net", sys:"b-sys", arch:"b-arch", disk:"b-disk" };
const catLabel = { file:"file & perms", text:"text processing", proc:"processes", net:"networking", sys:"system", arch:"archives", disk:"disk & storage" };

let activeCat = "disk";

function buildFilters() {
  const el = document.getElementById("filters");
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "pill" + (c.key === "disk" ? " active" : "");
    b.textContent = c.label;
    b.dataset.key = c.key;
    b.onclick = () => {
      activeCat = c.key;
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      b.classList.add("active");
      render();
    };
    el.appendChild(b);
  });
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const grid = document.getElementById("grid");
  const filtered = cmds.filter(c => {
    const catMatch = activeCat === "all" || c.cat === activeCat;
    if (!catMatch) return false;
    if (!q) return true;
    return c.cmd.toLowerCase().includes(q) ||
           c.desc.toLowerCase().includes(q) ||
           c.flags.some(f => f[0].toLowerCase().includes(q) || f[1].toLowerCase().includes(q));
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No commands match your search.</div>';
    return;
  }

  grid.innerHTML = filtered.map(c => `
    <div class="card">
      <div class="card-head">
        <span class="cmd">${c.cmd}</span>
        <span class="badge ${badgeClass[c.cat] || ''}">${catLabel[c.cat] || c.cat}</span>
      </div>
      <p class="desc">${c.desc}</p>
      <div class="flags">
        ${c.flags.map(f => `
          <div class="flag-row">
            <span class="flag-key">${f[0]}</span>
            <span class="flag-desc">${f[1]}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

buildFilters();
render();
</script>
